name: daily-assistant

# In-app notifications only (no e-mail/SMS by design).
# Runs ~21:45 India time (16:15 UTC). Free-tier friendly: <30s per run.
on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch: {}

jobs:
  daily-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install supabase python-dotenv
      - name: Run daily job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_USER_EMAIL: ${{ secrets.SUPABASE_USER_EMAIL }}
          SUPABASE_USER_PASSWORD: ${{ secrets.SUPABASE_USER_PASSWORD }}
        run: python scripts/daily_job.py
